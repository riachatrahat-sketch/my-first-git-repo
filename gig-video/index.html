<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editable PowerPoint Promo</title>
<style>
  html, body { margin: 0; background: #030914; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Fiverr gig promo: PDF / Figma / Illustrator / Image / Website -> editable PowerPoint.
// Every frame is a pure function of time, so render.mjs can capture it frame by frame.
const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const C = {
  navy: '#0A1F44', navy2: '#13305F', ink: '#0B1630', orange: '#FF7A1A', orange2: '#FFA24D',
  white: '#F5F7FB', slate: '#8EA0BF', slateDark: '#5B6B86', red: '#E5484D',
};

// Scene schedules (seconds). "voice" is synced to the voiceover pauses; "short" is the 15 s cut.
const MODES = {
  voice: { total: 29.6, s: [0, 4.1, 12.6, 20.2, 24.3, 29.6] },
  short: { total: 15.0, s: [0, 2.2, 5.4, 9.6, 12.3, 15.0] },
};
let mode = MODES.voice;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (u, a, b) => clamp((u - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIn = t => t * t * t;
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const eExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);

function rand(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rand(7);
const PARTS = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, r: 1 + R() * 3.5, v: 0.3 + R() * 1.2, a: 0.05 + R() * 0.25, o: R() < 0.25 }));

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function glow(c, x, y, r, col) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); }
function txt(c, s, x, y, o = {}) {
  const { size = 40, weight = 700, color = '#fff', align = 'left', alpha = 1, ls = 0, base = 'alphabetic' } = o;
  c.save(); c.globalAlpha *= alpha; c.font = `${weight} ${size}px Inter, sans-serif`; c.letterSpacing = ls + 'px';
  c.textAlign = align; c.textBaseline = base; c.fillStyle = color; c.fillText(s, x, y); c.restore();
}
function measure(c, s, size, weight = 700, ls = 0) { c.save(); c.font = `${weight} ${size}px Inter, sans-serif`; c.letterSpacing = ls + 'px'; const w = c.measureText(s).width; c.restore(); return w; }
// Masked slide-up text reveal.
function reveal(c, s, x, y, p, o = {}) {
  const e = eOut(clamp(p)); if (e <= 0) return; const sz = o.size || 40;
  c.save(); c.beginPath(); c.rect(-1e4, y - sz * 1.15, 2e4, sz * 1.5); c.clip();
  txt(c, s, x, y + (1 - e) * sz * 1.25, { ...o, alpha: (o.alpha ?? 1) * clamp(e * 1.6) }); c.restore();
}
function checkmark(c, x, y, s, col, lw = 3) { c.save(); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(x - s * .5, y); c.lineTo(x - s * .12, y + s * .38); c.lineTo(x + s * .55, y - s * .4); c.stroke(); c.restore(); }
function cursor(c, x, y, scale = 1, alpha = 1) {
  if (alpha <= 0) return; c.save(); c.globalAlpha *= alpha; c.translate(x, y); c.scale(scale, scale);
  c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 14; c.shadowOffsetY = 4;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 38); c.lineTo(10, 29); c.lineTo(17, 45); c.lineTo(24, 42); c.lineTo(17, 27); c.lineTo(30, 27); c.closePath();
  c.fillStyle = '#fff'; c.fill(); c.shadowColor = 'transparent'; c.lineWidth = 2.2; c.strokeStyle = '#0B1630'; c.lineJoin = 'round'; c.stroke(); c.restore();
}
function ripple(c, x, y, p, col = C.orange) {
  if (p <= 0 || p >= 1) return; c.save(); c.globalAlpha = 1 - p; c.strokeStyle = col; c.lineWidth = 3;
  c.beginPath(); c.arc(x, y, 8 + 46 * eOut(p), 0, Math.PI * 2); c.stroke(); c.restore();
}
function pill(c, s, x, y, o = {}) {
  const { size = 18, bg = C.orange, color = '#fff', alpha = 1, pad = 14, h = size * 2, weight = 700, stroke = null, ls = 0.5 } = o;
  if (alpha <= 0) return; const w = measure(c, s, size, weight, ls) + pad * 2;
  c.save(); c.globalAlpha *= alpha; rr(c, x, y, w, h, h / 2); if (bg) { c.fillStyle = bg; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = 2; c.stroke(); }
  txt(c, s, x + pad, y + h / 2 + 1, { size, color, weight, base: 'middle', ls }); c.restore(); return w;
}
function lockGlyph(c, x, y, s, col) {
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = s * 0.14;
  c.beginPath(); c.arc(x, y - s * 0.12, s * 0.28, Math.PI, 0); c.stroke();
  rr(c, x - s * 0.42, y - s * 0.12, s * 0.84, s * 0.62, s * 0.1); c.fill(); c.restore();
}

// Offscreen buffers (grain + compositing).
const grain = document.createElement('canvas'); grain.width = 512; grain.height = 512;
{ const g = grain.getContext('2d'); const id = g.createImageData(512, 512); const r = rand(3);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bctx = buf.getContext('2d');

// ---------- background ----------
function background(c, t) {
  const g = c.createRadialGradient(960, 470, 80, 960, 540, 1250);
  g.addColorStop(0, '#11294F'); g.addColorStop(0.5, '#081733'); g.addColorStop(1, '#030914');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  glow(c, 1500 + Math.sin(t * 0.35) * 140, 840 + Math.cos(t * 0.3) * 70, 760, 'rgba(255,122,26,0.15)');
  glow(c, 360 + Math.cos(t * 0.25) * 120, 200 + Math.sin(t * 0.3) * 40, 700, 'rgba(61,123,255,0.13)');
  // drifting dot grid
  c.fillStyle = 'rgba(255,255,255,0.045)';
  const ox = (t * 6) % 48, oy = (t * 10) % 48;
  for (let x = -48; x < W + 48; x += 48) for (let y = -48; y < H + 48; y += 48) c.fillRect(x + ox, y + oy, 2, 2);
  // bokeh
  for (const p of PARTS) {
    let y = (p.y - t * p.v * 30) % (H + 60); if (y < -30) y += H + 60;
    c.globalAlpha = p.a * (0.7 + 0.3 * Math.sin(t * 2 + p.x));
    c.fillStyle = p.o ? C.orange2 : '#9DB6FF';
    c.beginPath(); c.arc(p.x + Math.sin(t * 0.5 + p.y) * 12, y, p.r, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
}
function finish(c, t) {
  const v = c.createRadialGradient(960, 540, 520, 960, 540, 1200);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.save(); c.globalAlpha = 0.035; c.globalCompositeOperation = 'overlay';
  const f = Math.floor(t * 30); const ox = (f * 137) % 512, oy = (f * 263) % 512;
  c.fillStyle = c.createPattern(grain, 'repeat'); c.translate(-ox, -oy); c.fillRect(0, 0, W + 512, H + 512); c.restore();
}

// ---------- the static PDF page ----------
function pdfPage(c, x, y, w, h, o = {}) {
  const { alpha = 1, lock = 0, rot = 0 } = o; if (alpha <= 0) return;
  const s = w / 500;
  c.save(); c.globalAlpha *= alpha; c.translate(x + w / 2, y + h / 2); c.rotate(rot); c.scale(s, s * (h / w) / 1.3); c.translate(-250, -325);
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 60; c.shadowOffsetY = 30;
  rr(c, 0, 0, 500, 650, 12); c.fillStyle = '#F2F3F6'; c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = '#D9DDE4'; c.beginPath(); c.moveTo(440, 0); c.lineTo(500, 60); c.lineTo(440, 60); c.closePath(); c.fill();
  rr(c, 36, 36, 86, 38, 8); c.fillStyle = C.red; c.fill(); txt(c, 'PDF', 79, 56, { size: 20, align: 'center', base: 'middle' });
  c.fillStyle = '#B9C0CC'; rr(c, 36, 106, 300, 26, 6); c.fill(); rr(c, 36, 144, 220, 26, 6); c.fill();
  c.fillStyle = '#D5DAE2'; rr(c, 36, 196, 428, 170, 10); c.fill();
  c.fillStyle = '#BCC3CE'; c.beginPath(); c.moveTo(60, 366); c.lineTo(170, 260); c.lineTo(260, 340); c.lineTo(330, 290); c.lineTo(440, 366); c.closePath(); c.fill();
  c.beginPath(); c.arc(390, 245, 22, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#CDD3DC'; [428, 400, 420, 260].forEach((lw, i) => { rr(c, 36, 392 + i * 24, lw, 10, 5); c.fill(); });
  c.fillStyle = '#C3C9D3'; [40, 62, 50, 84, 70].forEach((bh, i) => { c.fillRect(40 + i * 34, 610 - bh, 22, bh); });
  c.fillStyle = '#CDD3DC'; [180, 150, 170].forEach((lw, i) => { rr(c, 240, 520 + i * 24, lw, 10, 5); c.fill(); });
  const lc = lock > 0 ? C.red : '#1B2B4A';
  c.beginPath(); c.arc(446, 604, 26 + lock * 6, 0, Math.PI * 2); c.fillStyle = lc; c.fill();
  lockGlyph(c, 446, 606, 30, '#fff');
  // flat "scan" sheen
  c.restore();
}

// ---------- the designed slide (unit space 1100 x 620) ----------
const OLD_TITLE = 'Growth Strategy', NEW_TITLE = 'Your Pitch Deck';
const ELEMS = [
  { id: 'tag', box: [64, 54, 214, 52], off: [-40, -100], draw: c => pill(c, 'STRATEGY 2027', 70, 60, { size: 18, ls: 2, h: 40, pad: 16 }) },
  { id: 'title', box: [62, 120, 580, 84], off: [-150, -25], label: 'Editable Text' },
  { id: 'sub', box: [62, 222, 500, 36], off: [-170, 25], draw: c => txt(c, 'Turning ideas into measurable results', 70, 248, { size: 24, weight: 500, color: C.slateDark }) },
  { id: 'icons', box: [62, 320, 456, 160], off: [-150, 125], label: 'Icons', draw: drawIconRow },
  { id: 'chart', box: [600, 176, 450, 340], off: [170, 60], label: 'Charts', draw: drawChart },
  { id: 'shapes', box: [870, 34, 190, 120], off: [160, -110], label: 'Shapes', draw: drawShapes },
];
function drawIconRow(c) {
  const names = ['Vision', 'Growth', 'Quality'];
  names.forEach((n, i) => {
    const cx = 130 + i * 150, cy = 372;
    const g = c.createLinearGradient(cx - 44, cy - 44, cx + 44, cy + 44); g.addColorStop(0, C.navy2); g.addColorStop(1, C.navy);
    c.beginPath(); c.arc(cx, cy, 44, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round';
    if (i === 0) { c.beginPath(); c.moveTo(cx - 22, cy); c.quadraticCurveTo(cx, cy - 22, cx + 22, cy); c.quadraticCurveTo(cx, cy + 22, cx - 22, cy); c.stroke(); c.beginPath(); c.arc(cx, cy, 7, 0, Math.PI * 2); c.fillStyle = C.orange; c.fill(); }
    if (i === 1) { c.beginPath(); c.moveTo(cx - 20, cy + 14); c.lineTo(cx - 6, cy); c.lineTo(cx + 4, cy + 8); c.lineTo(cx + 20, cy - 12); c.stroke(); c.beginPath(); c.moveTo(cx + 8, cy - 13); c.lineTo(cx + 21, cy - 13); c.lineTo(cx + 21, cy); c.strokeStyle = C.orange; c.stroke(); }
    if (i === 2) { c.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 9 : 21; c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } c.closePath(); c.fillStyle = C.orange; c.fill(); }
    txt(c, n, cx, 454, { size: 20, weight: 600, color: C.navy, align: 'center' });
  });
}
function drawChart(c) {
  rr(c, 606, 182, 438, 328, 18); c.fillStyle = '#F1F4F9'; c.fill();
  txt(c, 'Revenue Growth', 632, 222, { size: 20, weight: 700, color: C.navy });
  txt(c, '+68%', 1018, 222, { size: 20, weight: 800, color: C.orange, align: 'right' });
  c.strokeStyle = '#D6DDE8'; c.lineWidth = 1.5; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(632, 290 + i * 50); c.lineTo(1018, 290 + i * 50); c.stroke(); }
  [80, 118, 150, 196, 236].forEach((bh, i) => {
    const x = 646 + i * 76; rr(c, x, 482 - bh, 46, bh, [8, 8, 0, 0]);
    if (i === 4) { const g = c.createLinearGradient(0, 482 - bh, 0, 482); g.addColorStop(0, C.orange2); g.addColorStop(1, C.orange); c.fillStyle = g; }
    else c.fillStyle = i % 2 ? C.navy2 : C.navy;
    c.fill();
  });
}
function drawShapes(c) {
  c.beginPath(); c.arc(918, 92, 40, 0, Math.PI * 2); c.fillStyle = C.orange; c.fill();
  c.save(); c.translate(1004, 82); c.rotate(0.35); rr(c, -34, -34, 68, 68, 14); c.fillStyle = C.navy; c.fill(); c.restore();
  c.beginPath(); c.arc(975, 132, 14, 0, Math.PI * 2); c.strokeStyle = C.orange; c.lineWidth = 5; c.stroke();
}
function selBox(c, b, a, lw, handles = true) {
  if (a <= 0) return; const [x, y, w, h] = b;
  c.save(); c.globalAlpha *= a; c.strokeStyle = C.orange; c.lineWidth = lw; c.setLineDash([8 * lw / 2, 6 * lw / 2]); c.strokeRect(x, y, w, h); c.setLineDash([]);
  if (handles) { const hs = 11 * lw / 2;
    [[x, y], [x + w / 2, y], [x + w, y], [x, y + h / 2], [x + w, y + h / 2], [x, y + h], [x + w / 2, y + h], [x + w, y + h]].forEach(([hx, hy]) => {
      c.fillStyle = '#fff'; c.fillRect(hx - hs / 2, hy - hs / 2, hs, hs); c.lineWidth = lw * 0.9; c.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs); }); }
  c.restore();
}
// st: explode 0..1, boxes 0..1, scanY (unit y, null = none), veil 0..1, title, select 0..1, caret bool, labels 0..1, titleBox 0..1
function slide(c, x, y, w, h, st = {}) {
  const { explode = 0, boxes = 0, scanY = null, veil = 0, title = OLD_TITLE, select = 0, caret = false, labels = 0, titleBox = 0, t = 0, shadow = true } = st;
  const s = w / 1100;
  c.save(); c.translate(x, y); c.scale(s, h / 620);
  // base sheet
  c.save(); const bs = 1 - 0.035 * explode; c.translate(550, 310); c.scale(bs, bs); c.translate(-550, -310);
  if (shadow) { c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 70; c.shadowOffsetY = 30; }
  rr(c, 0, 0, 1100, 620, 14); c.fillStyle = '#FFFFFF'; c.fill(); c.shadowColor = 'transparent';
  c.save(); rr(c, 0, 0, 1100, 620, 14); c.clip(); c.fillStyle = C.navy; c.fillRect(0, 604, 1100, 16); c.fillStyle = C.orange; c.fillRect(0, 604, 260, 16); c.restore();
  if (explode > 0) { rr(c, 0, 0, 1100, 620, 14); c.fillStyle = `rgba(10,31,68,${0.55 * explode})`; c.fill();
    c.strokeStyle = `rgba(255,255,255,${0.25 * explode})`; c.lineWidth = 2; c.setLineDash([10, 8]); c.stroke(); c.setLineDash([]); }
  c.restore();
  ELEMS.forEach((el, i) => {
    const [bx, by, bw, bh] = el.box; const cx = bx + bw / 2, cy = by + bh / 2;
    const fl = Math.sin(t * 1.6 + i * 1.3) * 6 * clamp(explode);
    c.save(); c.translate(el.off[0] * explode, el.off[1] * explode + fl);
    const sc = 1 + 0.05 * clamp(explode); c.translate(cx, cy); c.scale(sc, sc); c.translate(-cx, -cy);
    if (explode > 0.01) { c.save(); c.globalAlpha = clamp(explode); c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 40; c.shadowOffsetY = 18; rr(c, bx - 8, by - 8, bw + 16, bh + 16, 14); c.fillStyle = 'rgba(255,255,255,0.96)'; c.fill(); c.restore(); }
    if (el.id === 'title') {
      const tw = measure(c, title, 66, 800, -1);
      if (select > 0) { c.fillStyle = `rgba(255,122,26,${0.28 * select})`; c.fillRect(68, 128, tw * eOut(select) + 6, 76); }
      txt(c, title, 70, 188, { size: 66, weight: 800, color: C.navy, ls: -1 });
      if (caret) { c.fillStyle = C.orange; c.fillRect(74 + tw, 132, 4, 68); }
    } else el.draw(c);
    let ba = boxes; if (scanY !== null) ba = Math.min(ba, clamp((scanY - by) / 60));
    if (el.id === 'title') ba = Math.max(ba, titleBox);
    selBox(c, [bx - 6, by - 6, bw + 12, bh + 12], ba, 2.5 / Math.max(s, 0.3), el.id === 'title' || explode > 0.2);
    if (el.label && labels > 0) {
      c.save(); c.globalAlpha *= clamp(labels); const pw = measure(c, el.label, 17, 700, 0.5) + 28 + 26;
      rr(c, bx - 8, by - 50, pw, 34, 17); c.fillStyle = C.orange; c.fill();
      checkmark(c, bx + 10, by - 33, 13, '#fff', 3);
      txt(c, el.label, bx + 24, by - 32, { size: 17, weight: 700, base: 'middle', ls: 0.5 }); c.restore();
    }
    c.restore();
  });
  // raster veil below the scan line (looks flat / uneditable)
  if (veil > 0) {
    const vy = scanY === null ? 0 : clamp(scanY, 0, 620);
    c.save(); rr(c, 0, 0, 1100, 620, 14); c.clip(); c.beginPath(); c.rect(0, vy, 1100, 620 - vy); c.clip();
    c.fillStyle = `rgba(150,160,178,${0.5 * veil})`; c.fillRect(0, 0, 1100, 620);
    c.strokeStyle = `rgba(255,255,255,${0.22 * veil})`; c.lineWidth = 2; for (let k = -620; k < 1100; k += 14) { c.beginPath(); c.moveTo(k, 620); c.lineTo(k + 620, 0); c.stroke(); }
    c.restore();
  }
  if (scanY !== null && scanY > 0 && scanY < 620) {
    const g = c.createLinearGradient(0, scanY - 70, 0, scanY); g.addColorStop(0, 'rgba(255,122,26,0)'); g.addColorStop(1, 'rgba(255,122,26,0.35)');
    c.fillStyle = g; c.fillRect(-20, scanY - 70, 1140, 70); c.fillStyle = C.orange2; c.shadowColor = C.orange; c.shadowBlur = 25; c.fillRect(-30, scanY - 2, 1160, 4); c.shadowColor = 'transparent';
  }
  c.restore();
}

// ---------- source format cards ----------
const SOURCES = [
  { name: 'PDF', sub: 'Documents', col: C.red },
  { name: 'Figma', sub: 'Design files', col: '#7B61FF' },
  { name: 'Illustrator', sub: 'AI artwork', col: '#2A1608' },
  { name: 'Images', sub: 'PNG / JPG', col: '#12A37A' },
  { name: 'Websites', sub: 'Any URL', col: '#3D7BFF' },
];
const CARD_Y = [260, 400, 540, 680, 820];
function srcIcon(c, i, x, y, s = 64) {
  const k = s / 64; c.save(); c.translate(x, y); c.scale(k, k);
  rr(c, 0, 0, 64, 64, 14); c.fillStyle = SOURCES[i].col; c.fill();
  c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 3.5; c.lineCap = 'round'; c.lineJoin = 'round';
  if (i === 0) { rr(c, 17, 12, 30, 40, 4); c.fill(); txt(c, 'PDF', 32, 38, { size: 11, weight: 800, color: C.red, align: 'center' }); }
  if (i === 1) { c.beginPath(); c.moveTo(14, 46); c.bezierCurveTo(22, 14, 42, 50, 50, 18); c.stroke(); [[14, 46], [50, 18]].forEach(([a, b]) => { c.fillRect(a - 5, b - 5, 10, 10); }); c.beginPath(); c.arc(32, 32, 4, 0, Math.PI * 2); c.fill(); }
  if (i === 2) txt(c, 'Ai', 32, 44, { size: 30, weight: 800, color: '#FF9A00', align: 'center' });
  if (i === 3) { rr(c, 12, 16, 40, 32, 5); c.stroke(); c.beginPath(); c.moveTo(16, 44); c.lineTo(28, 30); c.lineTo(36, 38); c.lineTo(42, 32); c.lineTo(48, 44); c.closePath(); c.fill(); c.beginPath(); c.arc(42, 24, 4, 0, Math.PI * 2); c.fill(); }
  if (i === 4) { rr(c, 11, 15, 42, 34, 5); c.stroke(); c.beginPath(); c.moveTo(11, 24); c.lineTo(53, 24); c.stroke(); [17, 23, 29].forEach(d => { c.beginPath(); c.arc(d, 19.5, 1.6, 0, Math.PI * 2); c.fill(); }); }
  c.restore();
}
function srcCard(c, i, p) {

    reveal(c, 'Before Ordering', 960, 624, l2, { size: 112, weight: 800, align: 'center', ls: -2, color: C.orange });
  } else {
    shineText(c, [['Message Me', 960, 500, { size: 112, weight: 800, align: 'center', ls: -2 }], ['Before Ordering', 960, 624, { size: 112, weight: 800, align: 'center', ls: -2, color: C.orange }]], eInOut(prog(u, 0.48, 0.72)));
  }
  const ul = eOut(prog(u, 0.36, 0.52)); c.fillStyle = C.orange; c.fillRect(960 - 160 * ul, 668, 320 * ul, 5);
  reveal(c, 'Let’s transform your design into an editable PowerPoint.', 960, 740, prog(u, 0.38, 0.54), { size: 32, weight: 500, align: 'center', color: '#C9D4E8' });
}

function render(t) {
  const s = mode.s; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(ctx, t);
  let i = 0; while (i < 4 && t >= s[i + 1]) i++;
  const u = clamp((t - s[i]) / (s[i + 1] - s[i]));
  [s1, s2, s3, s4, s5][i](ctx, u, t, s[i + 1] - s[i]);
  finish(ctx, t);
}

window.setMode = m => { mode = MODES[m]; return mode.total; };
window.renderAt = t => render(t);
window.ready = document.fonts.load('800 40px Inter').then(() => Promise.all([500, 600, 700].map(w => document.fonts.load(`${w} 40px Inter`))));
const q = new URLSearchParams(location.search);
if (q.get('mode')) setMode(q.get('mode'));
if (!q.has('render')) ready.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % mode.total); requestAnimationFrame(loop); }; loop(); });
</script>
